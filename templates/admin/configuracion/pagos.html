{% extends 'admin/base.html' %}
{% block titulo %}Integración de Pagos{% endblock %}

{% block content %}
<div class="page-header">
  <nav class="breadcrumb">
    <a href="{{ url_for('admin.dashboard') }}">Inicio</a> &rsaquo;
    <a href="{{ url_for('admin.configuracion') }}">Configuración</a> &rsaquo;
    <span>Integración de Pagos</span>
  </nav>
  <h1 class="page-title">💳 Integración de Pagos — Mercado Pago</h1>
</div>


<div class="card-form">
  <form method="POST" action="{{ url_for('admin.configuracion_pagos_mp') }}" id="form-pagos">

    <div class="form-group">
      <label for="mp_public_key">Public Key</label>
      <input type="text" id="mp_public_key" name="mp_public_key"
             value="{{ config.mp_public_key }}" class="form-control"
             placeholder="APP_USR-...">
    </div>

    <div class="form-group">
      <label for="mp_access_token">Access Token</label>
      <div class="input-password-wrap">
        <input type="password" id="mp_access_token" name="mp_access_token"
               value="{{ config.mp_access_token }}" class="form-control"
               placeholder="APP_USR-...">
        <button type="button" class="btn-show-pass" onclick="togglePass()">👁</button>
      </div>
      <small class="form-hint">Se guarda enmascarado. Dejá en blanco para no modificarlo.</small>
    </div>

    <div class="form-group">
      <label for="mp_webhook_url">Webhook URL</label>
      <input type="text" id="mp_webhook_url" name="mp_webhook_url"
             value="{{ config.mp_webhook_url }}" class="form-control"
             placeholder="https://tudominio.com/webhooks/mp">
    </div>


    <div class="form-actions">
      <a href="{{ url_for('admin.configuracion') }}" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar configuración</button>
    </div>
  </form>
</div>

<script>
function togglePass() {
  const inp = document.getElementById('mp_access_token');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

</script>

<style>
.page-header { margin-bottom: 1.75rem; }
.breadcrumb { font-size: .85rem; color: #888; margin-bottom: .5rem; }
.breadcrumb a { color: #1A5276; text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }


.card-form {
  background: #fff; border: 1px solid #dde3ea;
  border-radius: 10px; padding: 2rem; max-width: 560px;
}
.form-group { margin-bottom: 1.25rem; }
.form-group label { display: block; font-weight: 600; margin-bottom: .4rem; color: #222; }
.form-control {
  width: 100%; padding: .55rem .75rem;
  border: 1px solid #ccc; border-radius: 6px;
  font-size: .95rem; box-sizing: border-box; font-family: monospace;
}
.form-control:focus { outline: none; border-color: #1A5276; box-shadow: 0 0 0 3px rgba(26,82,118,.15); }
.form-hint { font-size: .8rem; color: #888; margin-top: .25rem; display: block; }

.input-password-wrap { display: flex; gap: .5rem; }
.input-password-wrap .form-control { flex: 1; }
.btn-show-pass {
  background: #f0f4f8; border: 1px solid #ccc; border-radius: 6px;
  padding: 0 .75rem; cursor: pointer; font-size: 1rem;
}
.btn-show-pass:hover { background: #e0e8f0; }


.form-actions { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.75rem; }
.btn { padding: .55rem 1.4rem; border-radius: 6px; font-size: .95rem; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
.btn-primary { background: #1A5276; color: #fff; }
.btn-primary:hover { background: #154360; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
</style>
{% endblock %}
